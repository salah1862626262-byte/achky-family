<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عائلة elastic العشقي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Cairo',sans-serif;
background:#0b0b0b;
color:white;
overflow-x:hidden;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.8)),
linear-gradient(135deg,#111,#1d1d1d);
}

.hero-content h1{
font-size:85px;
font-weight:800;
margin-bottom:20px;
color:#fff;
}

.hero-content span{
color:#d4af37;
}

.hero-content p{
font-size:24px;
max-width:750px;
margin:auto;
line-height:2;
color:#ddd;
}

.btn{
display:inline-block;
margin-top:35px;
padding:18px 45px;
border-radius:60px;
background:#d4af37;
color:black;
text-decoration:none;
font-weight:800;
transition:.4s;
}

.btn:hover{
transform:scale(1.08);
background:white;
}

/* SECTION */

.section{
padding:100px 8%;
}

.title{
text-align:center;
font-size:55px;
margin-bottom:70px;
font-weight:800;
color:#d4af37;
}

/* FAMILY */

.family-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
}

.card{
background:#151515;
padding:35px;
border-radius:25px;
text-align:center;
transition:.4s;
border:1px solid rgba(255,255,255,.06);
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.card:hover{
transform:translateY(-10px);
border-color:#d4af37;
}

.card h2{
font-size:30px;
margin-bottom:15px;
color:#fff;
}

.card p{
color:#bbb;
line-height:1.9;
font-size:16px;
}

/* GRANDPARENTS */

.parents{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
margin-bottom:70px;
}

.parent-card{
background:linear-gradient(135deg,#d4af37,#b8860b);
padding:40px;
border-radius:30px;
text-align:center;
color:black;
box-shadow:0 10px 35px rgba(212,175,55,.4);
}

.parent-card h2{
font-size:38px;
margin-bottom:15px;
}

/* WHATSAPP */

.whatsapp{
padding:100px 20px;
text-align:center;
background:#111;
}

.whatsapp h1{
font-size:50px;
margin-bottom:20px;
color:#25D366;
}

.whatsapp p{
font-size:18px;
color:#ccc;
margin-bottom:35px;
}

.whatsapp a{
display:inline-block;
padding:18px 45px;
background:#25D366;
color:white;
font-size:20px;
font-weight:700;
border-radius:60px;
text-decoration:none;
transition:.4s
